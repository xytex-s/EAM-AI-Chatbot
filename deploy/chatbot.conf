server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://172.16.1.11:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # slow answers on CPU
        proxy_buffering off;       # lets answers type out instead of arriving all at once
    }
}
