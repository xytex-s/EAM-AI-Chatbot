# Nginx on VM 1 (and VM 3), run in Docker as the "web" container.
#
#   /            Ahmed's chat page (website/chat.html), served by Nginx itself
#   /static/...  its CSS and JavaScript (website/*.css, *.js)
#   /ask         questions, passed on to the chatbot on VM 2 (also covers /ask/stream)
#   /health      passed on to VM 2, for checking it's up
#   /test        Ethan's bare API test page on VM 2
#
# Run (on VM 1, from the home folder):
#   sudo docker run -d --name web --restart unless-stopped -p 80:80 \
#     -v ~/EAM-AI-Chatbot/deploy/chatbot.conf:/etc/nginx/conf.d/default.conf:ro \
#     -v ~/EAM-AI-Chatbot/website:/usr/share/nginx/html:ro \
#     nginx:stable-alpine

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;          # the website/ folder from the repo

    # The chat page. The site still loads if VM 2 is down; only answers fail.
    location = / {
        try_files /chat.html =404;
    }

    # chat.html asks for /static/style.css, /static/app.js and /static/theme.js
    location /static/ {
        alias /usr/share/nginx/html/;
    }

    # Questions go to Gunicorn on VM 2
    location /ask {
        proxy_pass http://172.16.1.11:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # slow answers on CPU
        proxy_buffering off;       # lets /ask/stream type out instead of arriving all at once
    }

    location = /health {
        proxy_pass http://172.16.1.11:8000;
    }

    # Ethan's test page (served by Flask at / on VM 2)
    location = /test {
        proxy_pass http://172.16.1.11:8000/;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}